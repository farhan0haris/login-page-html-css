<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your account to get started.">
  <title>Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Atmospheric Writing Desk Viewport -->
  <div class="desk-viewport">
    
    <!-- Directional Evening Lamp Illumination Falling Across the Desk -->
    <div class="desk-lamp-glow" aria-hidden="true"></div>
    <div class="desk-wood-grain" aria-hidden="true"></div>
    <div class="desk-vignette" aria-hidden="true"></div>

    <!-- The Correspondence Composition -->
    <main class="correspondence-scene">
      
      <!-- Backing Paper Layer (Physical Depth & Natural Offset) -->
      <div class="paper-backing-layer" aria-hidden="true">
        <div class="backing-border"></div>
      </div>

      <!-- Main Object: Preserved Stationery Sheet -->
      <article class="parchment-sheet" aria-labelledby="page-headline">
        
        <!-- Physical Paper Texture, Faint Creases, Corner Curl & Edge Aging -->
        <div class="paper-surface-tooth" aria-hidden="true"></div>
        <div class="paper-crease-vertical" aria-hidden="true"></div>
        <div class="paper-crease-diagonal" aria-hidden="true"></div>
        <div class="paper-edge-shading" aria-hidden="true"></div>
        <div class="paper-corner-curl" aria-hidden="true"></div>
        <div class="paper-lamp-sheen" aria-hidden="true"></div>
        <div class="letterpress-ornamental-frame" aria-hidden="true"></div>

        <!-- Tactile Rich Burgundy Wax Seal (Physical Pressed Paper Overlap) -->
        <aside class="wax-seal" aria-label="Wax Seal Accent">
          <div class="seal-wax-disc">
            <div class="seal-wax-rim" aria-hidden="true"></div>
            <div class="seal-crest-center">
              <span class="seal-monogram" aria-hidden="true">✦</span>
            </div>
            <div class="seal-shimmer" aria-hidden="true"></div>
          </div>
        </aside>

        <!-- Interior Content Surface -->
        <div class="sheet-content">
          
          <!-- Editorial Heading Hierarchy -->
          <header class="sheet-header">
            <div class="titles-block">
              <h1 id="page-headline" class="headline-text">Create your account.</h1>
              <p class="subheadline-text">Get started with your account.</p>
            </div>
          </header>

          <!-- Modern Authentication Form on Fine Parchment -->
          <form class="sheet-form" action="#" method="POST" novalidate>
            
            <!-- Full Name Field -->
            <div class="form-row">
              <label for="name" class="ink-label">Name</label>
              <div class="ink-input-wrapper">
                <input 
                  type="text" 
                  id="name" 
                  name="name" 
                  class="ink-input" 
                  placeholder="Your name" 
                  autocomplete="name" 
                  spellcheck="false"
                  required
                >
                <span class="ink-ruling-glow" aria-hidden="true"></span>
              </div>
            </div>

            <!-- Email Address Field -->
            <div class="form-row">
              <label for="email" class="ink-label">Email address</label>
              <div class="ink-input-wrapper">
                <input 
                  type="email" 
                  id="email" 
                  name="email" 
                  class="ink-input" 
                  placeholder="name@example.com" 
                  autocomplete="username" 
                  spellcheck="false"
                  required
                >
                <span class="ink-ruling-glow" aria-hidden="true"></span>
              </div>
            </div>

            <!-- Password Field -->
            <div class="form-row">
              <label for="password" class="ink-label">Password</label>
              <div class="ink-input-wrapper">
                <input 
                  type="password" 
                  id="password" 
                  name="password" 
                  class="ink-input" 
                  placeholder="••••••••••••" 
                  autocomplete="new-password" 
                  required
                >
                <span class="ink-ruling-glow" aria-hidden="true"></span>
              </div>
            </div>

            <!-- Confirm Password Field -->
            <div class="form-row">
              <label for="confirm-password" class="ink-label">Confirm password</label>
              <div class="ink-input-wrapper">
                <input 
                  type="password" 
                  id="confirm-password" 
                  name="confirm_password" 
                  class="ink-input" 
                  placeholder="••••••••••••" 
                  autocomplete="new-password" 
                  required
                >
                <span class="ink-ruling-glow" aria-hidden="true"></span>
              </div>
            </div>

            <!-- Primary Action Button -->
            <div class="form-action">
              <button type="submit" class="sheet-button" id="register-button">
                <span class="btn-text">Create account</span>
                <span class="btn-arrow" aria-hidden="true">→</span>
              </button>
            </div>

          </form>

          <!-- Sheet Footer Navigation -->
          <footer class="sheet-footer">
            <div class="navigation-switch">
              <span class="switch-prompt">Already have an account?</span>
              <a href="index.html" class="ink-link ink-link--prominent" id="signin-nav-link">Sign in</a>
            </div>
          </footer>

        </div>
      </article>

    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
