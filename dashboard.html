<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard — manage users and view account summary.">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Session gate: redirect before any content if not authenticated -->
  <script>
    if (sessionStorage.getItem('isLoggedIn') !== 'true') {
      window.location.replace('index.html');
    }
  </script>

  <!-- Atmospheric Writing Desk Viewport (shared environment) -->
  <div class="desk-viewport desk-viewport--dashboard">

    <!-- Directional Evening Lamp Illumination -->
    <div class="desk-lamp-glow" aria-hidden="true"></div>
    <div class="desk-wood-grain" aria-hidden="true"></div>
    <div class="desk-vignette" aria-hidden="true"></div>

    <!-- Dashboard Content Area -->
    <div id="dashboard-content" class="dashboard-wrapper" style="visibility: hidden; opacity: 0; transition: opacity 0.4s ease;">

      <!-- ═══════════════════════════════════════════════════════════════
           HEADER
           ═══════════════════════════════════════════════════════════════ -->
      <header class="dashboard-header">
        <div class="dashboard-header__inner">
          <div class="dashboard-header__left">
            <div class="dashboard-header__brand">
              <span class="dashboard-header__monogram" aria-hidden="true">✦</span>
              <h1 class="dashboard-header__title">Dashboard</h1>
            </div>
            <p id="dashboard-welcome" class="dashboard-header__welcome">Welcome, Admin.</p>
          </div>
          <div class="dashboard-header__right">
            <time id="dashboard-date" class="dashboard-header__date" aria-label="Current date and time"></time>
            <button type="button" class="dashboard-logout-btn" data-action="logout" id="logout-button" aria-label="Sign out of your account">
              <span class="logout-btn__text">Sign out</span>
              <span class="logout-btn__icon" aria-hidden="true">←</span>
            </button>
          </div>
        </div>
      </header>

      <!-- ═══════════════════════════════════════════════════════════════
           MAIN DASHBOARD CONTENT
           ═══════════════════════════════════════════════════════════════ -->
      <main class="dashboard-main">

        <!-- ─── Summary Cards ─── -->
        <section class="dashboard-cards" aria-label="Account Summary">
          <article class="summary-card" id="card-total-users">
            <div class="summary-card__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
            </div>
            <div class="summary-card__content">
              <p class="summary-card__label">Total Users</p>
              <p class="summary-card__value">120</p>
            </div>
          </article>

          <article class="summary-card" id="card-active-users">
            <div class="summary-card__icon summary-card__icon--active" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </div>
            <div class="summary-card__content">
              <p class="summary-card__label">Active Users</p>
              <p class="summary-card__value">95</p>
            </div>
          </article>

          <article class="summary-card" id="card-pending-requests">
            <div class="summary-card__icon summary-card__icon--pending" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
            </div>
            <div class="summary-card__content">
              <p class="summary-card__label">Pending Requests</p>
              <p class="summary-card__value">25</p>
            </div>
          </article>
        </section>

        <!-- ─── Recent Users Table ─── -->
        <section class="dashboard-table-section" aria-label="Recent Users">
          <div class="table-section__header">
            <h2 class="table-section__title">Recent Users</h2>
            <div class="table-section__controls">
              <!-- Search -->
              <div class="table-search-wrapper">
                <label for="user-search" class="sr-only">Search users</label>
                <input
                  type="search"
                  id="user-search"
                  class="table-search-input"
                  placeholder="Search users…"
                  autocomplete="off"
                  spellcheck="false"
                >
              </div>
              <!-- Filters -->
              <div class="table-filters" role="group" aria-label="Filter users by status">
                <button type="button" class="filter-btn filter-active" data-filter="all">All</button>
                <button type="button" class="filter-btn" data-filter="active">Active</button>
                <button type="button" class="filter-btn" data-filter="pending">Pending</button>
              </div>
            </div>
          </div>

          <div class="table-responsive-wrapper">
            <table class="users-table" aria-describedby="table-caption">
              <caption id="table-caption" class="sr-only">List of recent users with their name, email, and current status.</caption>
              <thead>
                <tr>
                  <th scope="col">Name</th>
                  <th scope="col">Email</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody id="users-table-body">
                <tr>
                  <td data-label="Name">Rahul</td>
                  <td data-label="Email"><a href="mailto:rahul@gmail.com" class="table-email-link">rahul@gmail.com</a></td>
                  <td data-label="Status"><span class="status-badge status-badge--active">Active</span></td>
                </tr>
                <tr>
                  <td data-label="Name">Priya</td>
                  <td data-label="Email"><a href="mailto:priya@gmail.com" class="table-email-link">priya@gmail.com</a></td>
                  <td data-label="Status"><span class="status-badge status-badge--active">Active</span></td>
                </tr>
                <tr>
                  <td data-label="Name">Arjun</td>
                  <td data-label="Email"><a href="mailto:arjun@gmail.com" class="table-email-link">arjun@gmail.com</a></td>
                  <td data-label="Status"><span class="status-badge status-badge--pending">Pending</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

      </main>

    </div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
